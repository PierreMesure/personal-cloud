---
- name: Ensure backup directory exists on VPS
  file:
    path: /opt/scripts
    state: directory
    mode: '0755'

- name: Deploy database backup script
  template:
    src: backup-db.sh.j2
    dest: /opt/scripts/backup-db.sh
    mode: '0700'

- name: Schedule daily database backup
  cron:
    name: "Immich Daily Postgres Backup"
    minute: "0"
    hour: "3"
    job: "/opt/scripts/backup-db.sh > /dev/null 2>&1"
    state: present
