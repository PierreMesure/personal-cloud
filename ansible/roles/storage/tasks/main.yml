- name: Install CIFS utilities
  apt:
    name: cifs-utils
    state: present

- name: Create credentials file
  copy:
    content: |
      username={{ storage_box_username }}
      password={{ storage_box_password }}
    dest: /etc/storage-box.credentials
    owner: root
    group: root
    mode: '0600'

- name: Create mount point
  file:
    path: /mnt/storage-box
    state: directory
    mode: '0755'

- name: Mount Storage Box via CIFS
  mount:
    path: /mnt/storage-box
    src: "//{{ storage_box_host }}/backup"
    fstype: cifs
    opts: "credentials=/etc/storage-box.credentials,uid=0,gid=0,file_mode=0777,dir_mode=0777,sec=ntlmssp,cache=none"
    state: mounted

- name: Create Docker systemd override directory
  file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: '0755'

- name: Require the photo storage mount before starting Docker
  copy:
    content: |
      [Unit]
      RequiresMountsFor=/mnt/storage-box
    dest: /etc/systemd/system/docker.service.d/storage-box.conf
    mode: '0644'
  register: docker_storage_dependency

- name: Reload systemd after updating the storage dependency
  systemd_service:
    daemon_reload: true
  when: docker_storage_dependency.changed
