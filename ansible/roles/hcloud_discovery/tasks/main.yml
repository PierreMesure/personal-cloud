---
- name: Fetch Hetzner server info
  hetzner.hcloud.hcloud_server_info:
    api_token: "{{ hcloud_token }}"
    name: "{{ server_name }}"
  register: server_info
  delegate_to: localhost
  become: no

- name: Ensure server was found
  fail:
    msg: "Server '{{ server_name }}' not found on Hetzner!"
  when: server_info.hcloud_server_info | length == 0
  delegate_to: localhost
  become: no

- name: Fetch Storage Box info
  hetzner.hcloud.storage_box:
    api_token: "{{ hcloud_token }}"
    name: "{{ storage_box_name }}"
    state: present
  register: storage_box_info
  delegate_to: localhost
  become: no

- name: Add discovered server to inventory
  add_host:
    name: "{{ server_info.hcloud_server_info[0].name }}"
    ansible_host: "{{ server_info.hcloud_server_info[0].ipv4_address }}"
    # Extract the first address from the IPv6 range (removing the /64)
    ansible_host_v6: "{{ server_info.hcloud_server_info[0].ipv6 | regex_replace('/64$', '1') }}"
    ansible_user: root
    groups: discovered_vps
    storage_box_username: "{{ storage_box_info.hcloud_storage_box.username }}"
    storage_box_host: "{{ storage_box_info.hcloud_storage_box.server }}"
  delegate_to: localhost
  become: no
