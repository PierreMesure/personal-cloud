---
- name: Fetch Hetzner server info
  hetzner.hcloud.hcloud_server_info:
    api_token: "{{ hcloud_token }}"
    name: "{{ server_name }}"
  register: server_info
  delegate_to: localhost
  become: no

- name: Ensure server was found
  fail:
    msg: "Server '{{ server_name }}' not found on Hetzner!"
  when: server_info.hcloud_server_info | length == 0
  delegate_to: localhost
  become: no

- name: Add discovered server to inventory
  add_host:
    name: "{{ server_info.hcloud_server_info[0].name }}"
    ansible_host: "{{ server_info.hcloud_server_info[0].ipv4_address }}"
    ansible_user: root
    groups: discovered_vps
  delegate_to: localhost
  become: no